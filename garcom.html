<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Mesas</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    /* CORES DA LOJA: vêm do painel (Configurações > Identidade da loja).
       A paleta "purple" do Tailwind passa a seguir a cor principal escolhida. */
    window.tailwind = window.tailwind || {};
    tailwind.config = { theme: { extend: { colors: { purple: (function () {
      var p = {}; [50,100,200,300,400,500,600,700,800,900,950].forEach(function (n) { p[n] = 'rgb(var(--p' + n + ') / <alpha-value>)'; }); return p;
    })() } } } };
  </script>
  <script>
    /* Paleta gerada a partir da cor principal (mesma função no painel) */
    function corHexParaRgb(h) { h = String(h || '').replace('#', ''); if (h.length === 3) h = h.replace(/./g, '$&$&'); var n = parseInt(h, 16); if (!/^[0-9a-fA-F]{6}$/.test(h)) return null; return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
    function corMisturar(c, alvo, t) { return c.map(function (v, i) { return Math.round(v + (alvo[i] - v) * t); }); }
    function corLuminancia(c) { var a = c.map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * a[0] + 0.7152 * a[1] + 0.0722 * a[2]; }
    function aplicarCoresLoja(primaria, destaque) {
      var c = corHexParaRgb(primaria) || [185, 28, 28];
      var tentativas = 0; // garante texto branco legível sobre a cor principal
      while ((1.05 / (corLuminancia(c) + 0.05)) < 4.2 && tentativas++ < 12) c = corMisturar(c, [0, 0, 0], 0.12);
      var d = corHexParaRgb(destaque) || [251, 191, 36];
      var B = [255, 255, 255], P = [0, 0, 0], r = document.documentElement.style;
      var tons = { 50: corMisturar(c, B, 0.94), 100: corMisturar(c, B, 0.87), 200: corMisturar(c, B, 0.74), 300: corMisturar(c, B, 0.55), 400: corMisturar(c, B, 0.32),
        500: corMisturar(c, B, 0.14), 600: c, 700: corMisturar(c, P, 0.12), 800: corMisturar(c, P, 0.25), 900: corMisturar(c, P, 0.38), 950: corMisturar(c, P, 0.55) };
      Object.keys(tons).forEach(function (k) { r.setProperty('--p' + k, tons[k].join(' ')); });
      var hex = function (x) { return '#' + x.map(function (v) { return ('0' + v.toString(16)).slice(-2); }).join(''); };
      r.setProperty('--cor', hex(c)); r.setProperty('--cor-escura', hex(tons[900])); r.setProperty('--cor-clara', hex(tons[100]));
      r.setProperty('--fundo', hex(corMisturar(c, B, 0.975))); r.setProperty('--destaque', hex(d));
      r.setProperty('--destaque-texto', corLuminancia(d) > 0.45 ? '#1f1300' : '#ffffff');
      var meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.setAttribute('content', hex(c));
    }
    // aplica já as cores da última visita (evita "piscar" a cor padrão)
    (function () { var m = {}; try { m = JSON.parse(localStorage.getItem('loja_marca') || '{}'); } catch (e) {} aplicarCoresLoja(m.cor_primaria, m.cor_destaque); })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="manifest" href="manifest-garcom.json">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mesas">
  <link rel="apple-touch-icon" href="admin-icone-192.png">
  <style>
    body { padding-bottom: env(safe-area-inset-bottom); -webkit-tap-highlight-color: transparent; }
    .tela { display: none; } .tela.ativa { display: block; }
    #toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 90; }
    @media print {
      body * { visibility: hidden; }
      #area-conta, #area-conta * { visibility: visible; font-weight: 900 !important; color: #000 !important; }
      #area-conta { position: absolute; left: 0; top: 0; width: 48mm; font-family: 'Courier New', monospace; font-size: 11px; padding: 1.5mm; }
      @page { margin: 0; }
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 antialiased min-h-screen select-none">

  <!-- topo -->
  <header class="bg-[var(--cor)] text-white sticky top-0 z-30 px-4 py-3 flex items-center gap-3 shadow">
    <button id="btn-voltar" onclick="voltar()" class="hidden w-9 h-9 -ml-1 rounded-full bg-white/10 flex items-center justify-center" aria-label="Voltar"><i class="fa-solid fa-arrow-left"></i></button>
    <img id="logo-topo" alt="" class="hidden w-9 h-9 rounded-lg object-contain">
    <div class="min-w-0 flex-1">
      <h1 id="titulo-topo" class="font-black text-base leading-tight truncate">Mesas</h1>
      <p id="sub-topo" class="text-[11px] text-white/70 truncate"></p>
    </div>
    <button id="btn-sair" onclick="sair()" class="hidden text-white/80 text-xs font-bold px-2 py-1 rounded-lg bg-white/10">Sair</button>
  </header>

  <!-- LOGIN -->
  <section id="tela-login" class="tela ativa px-5 pt-10 max-w-sm mx-auto">
    <div class="bg-white rounded-3xl p-6 shadow-sm space-y-4 text-center">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-[var(--cor)] text-[var(--destaque)] flex items-center justify-center text-2xl"><i class="fa-solid fa-bell-concierge"></i></div>
      <div><h2 class="font-black text-xl">App das mesas</h2><p class="text-xs text-gray-500">Entre com o seu usuário de garçom</p></div>
      <form onsubmit="entrar(event)" class="space-y-3">
        <input type="email" id="login-email" required autocomplete="username" placeholder="E-mail" class="w-full border border-gray-300 rounded-xl p-3 text-sm text-center">
        <input type="password" id="login-senha" required autocomplete="current-password" placeholder="Senha" class="w-full border border-gray-300 rounded-xl p-3 text-sm text-center">
        <p id="login-erro" class="hidden text-xs text-rose-600 font-bold"></p>
        <button id="btn-entrar" class="w-full bg-[var(--cor)] text-white font-black py-3 rounded-xl">Entrar</button>
      </form>
    </div>
  </section>

  <!-- MAPA DE MESAS -->
  <section id="tela-mapa" class="tela px-3 pt-3 pb-24 max-w-3xl mx-auto">
    <div id="aviso-desativado" class="hidden bg-amber-50 border border-amber-300 text-amber-900 rounded-2xl p-4 text-sm font-bold mb-3">O app de mesas está desligado no painel (Configurações → Mesas e garçons).</div>
    <div id="chamados" class="space-y-2 mb-3"></div>
    <div id="grade-mesas" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2.5"></div>
    <div class="flex flex-wrap gap-x-3 gap-y-1 text-[11px] text-gray-500 mt-4 px-1">
      <span><i class="fa-solid fa-square text-gray-300"></i> Livre</span>
      <span><i class="fa-solid fa-square text-amber-300"></i> Ocupada</span>
      <span><i class="fa-solid fa-square text-emerald-400"></i> Pronto p/ servir</span>
      <span><i class="fa-solid fa-square text-rose-400"></i> Chamando / conta</span>
    </div>
  </section>

  <!-- COMANDA DA MESA -->
  <section id="tela-mesa" class="tela px-3 pt-3 pb-40 max-w-xl mx-auto">
    <div id="mesa-chamado" class="hidden mb-3"></div>
    <div id="mesa-pedidos" class="space-y-2.5"></div>
    <div id="mesa-totais" class="bg-white rounded-2xl p-4 mt-3 shadow-sm"></div>
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-3 pb-[calc(12px+env(safe-area-inset-bottom))] z-20">
      <div class="max-w-xl mx-auto grid grid-cols-2 gap-2">
        <button onclick="abrirCardapio()" class="bg-[var(--cor)] text-white font-black py-3.5 rounded-2xl"><i class="fa-solid fa-plus mr-1"></i> Adicionar itens</button>
        <button id="btn-fechar-conta" onclick="abrirFechamento()" class="bg-white border-2 border-[var(--cor)] text-[var(--cor)] font-black py-3.5 rounded-2xl">Fechar conta</button>
      </div>
    </div>
  </section>

  <!-- CARDÁPIO / LANÇAR -->
  <section id="tela-cardapio" class="tela pb-28 max-w-xl mx-auto">
    <div class="sticky top-[60px] bg-gray-100 z-10 px-3 pt-3 pb-2 space-y-2">
      <div class="relative"><i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-gray-400 text-sm"></i>
        <input id="busca" oninput="renderizarCardapio()" placeholder="Buscar lanche ou bebida" class="w-full bg-white border border-gray-200 rounded-xl pl-9 p-3 text-sm"></div>
      <div id="categorias" class="flex gap-1.5 overflow-x-auto pb-1"></div>
    </div>
    <div id="lista-cardapio" class="px-3 space-y-1.5"></div>
    <div id="barra-rodada" class="hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-3 pb-[calc(12px+env(safe-area-inset-bottom))] z-20">
      <div class="max-w-xl mx-auto flex gap-2">
        <button onclick="abrirRodada()" class="flex-1 bg-[var(--cor)] text-white font-black py-3.5 rounded-2xl"><i class="fa-solid fa-fire-burner mr-1"></i> <span id="txt-rodada">Revisar</span></button>
      </div>
    </div>
  </section>

  <!-- folha de baixo (opções / revisão / fechar conta) -->
  <div id="folha-fundo" onclick="fecharFolha()" class="hidden fixed inset-0 bg-black/50 z-40"></div>
  <div id="folha" class="hidden fixed bottom-0 left-0 right-0 z-50 bg-white rounded-t-3xl max-h-[88vh] overflow-y-auto p-5 pb-[calc(20px+env(safe-area-inset-bottom))] max-w-xl mx-auto"></div>

  <div id="toast"></div>
  <div id="area-conta" class="hidden"></div>

  <script>
    'use strict';
    var CFG = window.CONFIG_SUPABASE || {};
    var URL_SB = String(CFG.url || '').replace(/\/+$/, ''), CHAVE = String(CFG.chave || '');
    var sb = (window.supabase && /^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(URL_SB) && CHAVE.indexOf('COLOQUE') === -1)
      ? window.supabase.createClient(URL_SB, CHAVE, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'loja-garcom-auth' } }) : null;
    var PONTOS = ['Mal passado', 'Ao ponto', 'Bem passado'];
    var estado = { tela: 'login', papel: null, nome: '', painel: null, mesa: null, cardapio: [], adicionais: [], paes: [], porId: {}, categoria: 'Todos', rodada: [], aberto: null, conhecidos: null, enviando: false };

    function $(id) { return document.getElementById(id); }
    function esc(v) { return String(v === null || v === undefined ? '' : v).replace(/[&<>"'`]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '`': '&#96;' }[c]; }); }
    function brl(v) { return 'R$ ' + (Number(v) || 0).toFixed(2).replace('.', ','); }
    function aviso(msg, cor) {
      var t = $('toast'); t.innerHTML = '<div class="px-4 py-3 rounded-2xl shadow-2xl text-sm font-bold text-white ' + (cor || 'bg-gray-900') + '">' + esc(msg) + '</div>';
      clearTimeout(aviso._t); aviso._t = setTimeout(function () { t.innerHTML = ''; }, 2600);
    }
    function minutos(iso) { var m = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000)); return m < 60 ? m + ' min' : Math.floor(m / 60) + 'h' + String(m % 60).padStart(2, '0'); }
    function bipe(vezes) {
      try {
        var ctx = bipe._c = bipe._c || new (window.AudioContext || window.webkitAudioContext)(); var t = ctx.currentTime;
        for (var i = 0; i < (vezes || 2); i++) { var o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 1046; g.gain.setValueAtTime(0.0001, t + i * 0.25); g.gain.exponentialRampToValueAtTime(0.5, t + i * 0.25 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.25 + 0.18); o.connect(g); g.connect(ctx.destination); o.start(t + i * 0.25); o.stop(t + i * 0.25 + 0.2); }
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      } catch (e) {}
    }

    /* ---------------- marca da loja ---------------- */
    function marca(c) {
      try { localStorage.setItem('loja_marca', JSON.stringify(c)); } catch (e) {}
      aplicarCoresLoja(c.cor_primaria, c.cor_destaque);
      if (c.logo_url) { $('logo-topo').src = c.logo_url; $('logo-topo').classList.remove('hidden'); }
    }
    (function () { try { var m = JSON.parse(localStorage.getItem('loja_marca') || 'null'); if (m) document.addEventListener('DOMContentLoaded', function () { marca(m); }); } catch (e) {} })();

    /* ---------------- telas ---------------- */
    function irPara(tela) {
      estado.tela = tela;
      document.querySelectorAll('.tela').forEach(function (s) { s.classList.toggle('ativa', s.id === 'tela-' + tela); });
      $('btn-voltar').classList.toggle('hidden', tela === 'mapa' || tela === 'login');
      $('btn-sair').classList.toggle('hidden', tela !== 'mapa');
      var nomeLoja = estado.painel && estado.painel.nome_loja || '';
      if (tela === 'mapa') { $('titulo-topo').textContent = 'Mesas'; $('sub-topo').textContent = (nomeLoja ? nomeLoja + ' · ' : '') + estado.nome; if (estado.painel) renderizarMapa(); }
      if (tela === 'mesa') renderizarMesa();
      if (tela === 'cardapio') { $('titulo-topo').textContent = 'Mesa ' + estado.mesa + ' · cardápio'; $('sub-topo').textContent = 'Toque para adicionar'; renderizarCardapio(); }
      window.scrollTo(0, 0);
    }
    function voltar() {
      if (estado.tela === 'cardapio') { if (estado.rodada.length && !confirm('Descartar os ' + estado.rodada.length + ' itens ainda não enviados?')) return; estado.rodada = []; irPara('mesa'); }
      else irPara('mapa');
    }

    /* ---------------- login ---------------- */
    async function entrar(e) {
      e.preventDefault();
      var err = $('login-erro'); err.classList.add('hidden');
      if (!sb) { err.textContent = 'App não configurado (config.js).'; err.classList.remove('hidden'); return; }
      $('btn-entrar').disabled = true;
      var r = await sb.auth.signInWithPassword({ email: $('login-email').value.trim(), password: $('login-senha').value });
      $('btn-entrar').disabled = false;
      if (r.error) { err.textContent = /Invalid login/i.test(r.error.message) ? 'E-mail ou senha incorretos.' : r.error.message; err.classList.remove('hidden'); return; }
      $('login-senha').value = '';
      await iniciarSessao();
    }
    async function iniciarSessao() {
      var p = await sb.rpc('meu_papel');
      if (p.error || !p.data || !p.data.papel) {
        await sb.auth.signOut();
        $('login-erro').textContent = p.error ? 'Erro: ' + p.error.message : 'Este usuário não é garçom desta loja. Peça ao dono para cadastrar você no painel.';
        $('login-erro').classList.remove('hidden'); irPara('login'); return;
      }
      estado.papel = p.data.papel; estado.nome = p.data.papel === 'admin' ? 'Administrador' : p.data.nome;
      await carregarCardapio();
      await atualizar();
      irPara('mapa');
      clearInterval(estado.timer); estado.timer = setInterval(atualizar, 5000);
    }
    async function sair() { if (!confirm('Sair do app das mesas?')) return; clearInterval(estado.timer); await sb.auth.signOut(); irPara('login'); }

    /* ---------------- dados ---------------- */
    async function carregarCardapio() {
      var r = await Promise.all([
        sb.from('cardapio').select('*').eq('ativo', true).order('ordem').order('id'),
        sb.from('adicionais').select('*').eq('ativo', true).order('ordem').order('nome'),
        sb.from('tipos_pao').select('*').eq('ativo', true).order('ordem').order('nome'),
        sb.from('configuracoes_loja').select('nome_loja, logo_url, cor_primaria, cor_destaque').eq('id', 1).maybeSingle()
      ]);
      estado.cardapio = r[0].data || []; estado.adicionais = r[1].data || []; estado.paes = (!r[2].error && r[2].data) || [];
      estado.porId = {}; estado.cardapio.forEach(function (p) { estado.porId[String(p.id)] = p; });
      if (r[3].data) marca(r[3].data);
    }
    async function atualizar() {
      if (document.hidden && estado.painel) return;
      var r = await sb.rpc('mesas_painel');
      if (r.error) { if (/Acesso negado|JWT/i.test(r.error.message)) { clearInterval(estado.timer); irPara('login'); } return; }
      var antes = estado.conhecidos, agora = {};
      (r.data.mesas || []).forEach(function (m) {
        if (m.chamado_em) agora['c' + m.numero + m.chamado_em] = 1;
        ((m.conta || {}).pedidos || []).forEach(function (p) { if (p.status === 'Aguardando Aceite da Loja') agora['q' + p.id] = 1; if (p.status === 'Saiu para entrega') agora['p' + p.id] = 1; });
      });
      if (antes && Object.keys(agora).some(function (k) { return !antes[k]; })) bipe(3);
      estado.conhecidos = agora;
      estado.painel = r.data;
      $('aviso-desativado').classList.toggle('hidden', !!r.data.ativo);
      if (estado.tela === 'mapa') renderizarMapa();
      if (estado.tela === 'mesa') renderizarMesa();
    }
    function mesaAtual() { return (estado.painel.mesas || []).find(function (m) { return m.numero === estado.mesa; }) || { numero: estado.mesa }; }
    function situacao(m) {
      var c = m.conta, ped = c ? c.pedidos.filter(function (p) { return ['Cancelado', 'Recusado'].indexOf(p.status) === -1; }) : [];
      return {
        aberta: !!c, total: ped.reduce(function (s, p) { return s + Number(p.total || 0); }, 0),
        prontos: ped.filter(function (p) { return p.status === 'Saiu para entrega'; }).length,
        aguardando: ped.filter(function (p) { return p.status === 'Aguardando Aceite da Loja'; }).length,
        chamado: m.chamado_tipo || (c && c.status === 'conta_pedida' ? 'conta' : null)
      };
    }

    /* ---------------- mapa ---------------- */
    function renderizarMapa() {
      var mesas = estado.painel.mesas || [];
      $('chamados').innerHTML = mesas.filter(function (m) { var s = situacao(m); return s.chamado || s.aguardando; }).map(function (m) {
        var s = situacao(m);
        var txt = s.aguardando ? s.aguardando + ' pedido(s) pelo QR para aceitar' : s.chamado === 'conta' ? 'pediu a conta' : 'está chamando o garçom';
        return '<button onclick="abrirMesa(' + m.numero + ')" class="w-full text-left bg-rose-600 text-white rounded-2xl px-4 py-3 font-bold flex items-center gap-3 animate-pulse"><i class="fa-solid ' + (s.aguardando ? 'fa-qrcode' : 'fa-bell') + ' text-lg"></i><span class="flex-1">Mesa ' + m.numero + ' ' + txt + '</span><i class="fa-solid fa-chevron-right"></i></button>';
      }).join('');
      $('grade-mesas').innerHTML = mesas.map(function (m) {
        var s = situacao(m), cls, linha2 = '', linha3 = '';
        if (s.chamado || s.aguardando) cls = 'bg-rose-50 border-2 border-rose-400';
        else if (s.prontos) cls = 'bg-emerald-50 border-2 border-emerald-400';
        else if (s.aberta) cls = 'bg-amber-50 border border-amber-300';
        else cls = 'bg-white border border-gray-200';
        if (s.aberta) { linha2 = '<p class="font-black text-base">' + brl(s.total) + '</p>'; linha3 = '<p class="text-[11px] text-gray-500">' + minutos(m.conta.aberta_em) + ' · ' + m.conta.pessoas + ' pess.</p>'; }
        else linha2 = '<p class="text-xs text-gray-400 mt-1">Livre</p>';
        var etiqueta = s.aguardando ? '<span class="text-[10px] font-black bg-rose-600 text-white px-1.5 py-0.5 rounded">QR</span>'
          : s.chamado ? '<span class="text-[10px] font-black bg-rose-600 text-white px-1.5 py-0.5 rounded">' + (s.chamado === 'conta' ? 'CONTA' : 'CHAMOU') + '</span>'
          : s.prontos ? '<span class="text-[10px] font-black bg-emerald-600 text-white px-1.5 py-0.5 rounded">' + s.prontos + ' PRONTO' + (s.prontos > 1 ? 'S' : '') + '</span>' : '';
        return '<button onclick="abrirMesa(' + m.numero + ')" class="text-left rounded-2xl p-3 min-h-[92px] active:scale-95 transition ' + cls + '">' +
          '<div class="flex justify-between items-start gap-1"><p class="font-black text-lg leading-none">' + m.numero + '</p>' + etiqueta + '</div>' + linha2 + linha3 + '</button>';
      }).join('') || '<p class="col-span-full text-center text-sm text-gray-400 py-10">Nenhuma mesa cadastrada.</p>';
    }

    /* ---------------- mesa ---------------- */
    function abrirMesa(n) { estado.mesa = n; estado.rodada = []; irPara('mesa'); }
    var ROTULO = { 'Aguardando Aceite da Loja': ['Pedido pelo QR', 'bg-rose-100 text-rose-800'], 'Em preparo': ['Na cozinha', 'bg-amber-100 text-amber-800'],
      'Saiu para entrega': ['Pronto p/ servir', 'bg-emerald-600 text-white'], 'Concluído': ['Servido', 'bg-gray-100 text-gray-600'],
      'Cancelado': ['Cancelado', 'bg-gray-100 text-gray-400 line-through'], 'Recusado': ['Recusado', 'bg-gray-100 text-gray-400 line-through'] };
    function detalhes(i) {
      var l = [];
      (i.escolhas || []).forEach(function (e) { l.push(String(e.grupo || '').replace(/^escolha (a |o )?/i, '') + ': ' + e.nome); });
      if (i.pao && i.pao.trocado) l.push('<b class="text-amber-700">TROCAR PÃO: ' + esc(i.pao.nome) + '</b>');
      if (i.ponto) l.push('Ponto: ' + esc(i.ponto));
      if ((i.sem || []).length) l.push('<b class="text-rose-700">SEM ' + esc(i.sem.join(', SEM ').toUpperCase()) + '</b>');
      if ((i.adicionais || []).length) l.push('+ ' + esc(i.adicionais.map(function (a) { return typeof a === 'string' ? a : a.nome; }).join(', ')));
      if (i.observacao) l.push('<i>Obs: ' + esc(i.observacao) + '</i>');
      return l;
    }

    function imprimirConta() {
      var m = mesaAtual(), v = valoresFechamento(), P = estado.painel, linhas = '';
      (m.conta.pedidos || []).filter(function (p) { return ['Cancelado', 'Recusado'].indexOf(p.status) === -1; }).forEach(function (p) {
        (p.itens || []).forEach(function (i) { linhas += '<div style="display:flex;justify-content:space-between;"><span>' + esc(i.quantidade) + 'x ' + esc(i.nome) + '</span><span>' + brl(i.preco_unitario * i.quantidade) + '</span></div>'; });
      });
      var a = $('area-conta');
      a.innerHTML = '<div style="text-align:center;font-size:13px;">' + esc((P.nome_loja || '').toUpperCase()) + '</div><div style="text-align:center;">CONTA · MESA ' + estado.mesa + '</div><div style="text-align:center;font-size:10px;">' + new Date().toLocaleString('pt-BR') + '</div><div style="border-top:1px dashed #000;margin:4px 0;"></div>' + linhas +
        '<div style="border-top:1px dashed #000;margin:4px 0;"></div><div style="display:flex;justify-content:space-between;"><span>Consumo</span><span>' + brl(v.consumo) + '</span></div>' +
        (v.comTaxa ? '<div style="display:flex;justify-content:space-between;"><span>Serviço ' + P.taxa_pct + '%</span><span>' + brl(v.taxa) + '</span></div>' : '') +
        '<div style="display:flex;justify-content:space-between;font-size:14px;"><span>TOTAL</span><span>' + brl(v.total) + '</span></div>' +
        (v.pessoas > 1 ? '<div style="text-align:right;">' + v.pessoas + ' pessoas: ' + brl(v.total / v.pessoas) + ' cada</div>' : '') + '<div style="text-align:center;margin-top:6px;">Obrigado pela preferência!</div>';
      a.classList.remove('hidden'); setTimeout(function () { window.print(); setTimeout(function () { a.classList.add('hidden'); }, 1000); }, 80);
    }

    /* ---------------- folha ---------------- */
    function abrirFolha(html) { $('folha').innerHTML = html; $('folha').classList.remove('hidden'); $('folha-fundo').classList.remove('hidden'); }
    function fecharFolha() { $('folha').classList.add('hidden'); $('folha-fundo').classList.add('hidden'); estado.aberto = null; }

    /* ---------------- início ---------------- */
    document.addEventListener('DOMContentLoaded', async function () {
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw-garcom.js', { scope: './garcom.html' }).catch(function () {});
      if (!sb) { $('login-erro').textContent = 'App não configurado: preencha o arquivo config.js.'; $('login-erro').classList.remove('hidden'); return; }
      var s = await sb.auth.getSession();
      if (s.data && s.data.session) await iniciarSessao();
      document.addEventListener('visibilitychange', function () { if (!document.hidden && estado.papel) atualizar(); });
    });
  </script>
</body>
</html>
